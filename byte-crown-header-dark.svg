  </g>
  <text x="490" y="177" fill="#f7fff8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="78" font-weight="800" letter-spacing="8">BYTE//CROWN</text>
  <text x="494" y="225" fill="#8fb99a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="4">COMPUTER · ASSEMBLER · PROTOCOL · ONE BYTE LAW</text>
