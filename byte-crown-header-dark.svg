  <rect x="22" y="22" width="1556" height="476" rx="24" fill="url(#grid)" stroke="#65ff91" stroke-opacity="0.24"/>
  <path d="M58 90H430M58 430H1542M478 90H1542" stroke="url(#signal)" stroke-width="2" stroke-opacity="0.7"/>
