    <text x="971" y="316" fill="#f7fff8" font-size="34" font-weight="800" letter-spacing="18">DDDDDD</text>
    <text x="971" y="379" fill="#75947d" font-size="15" letter-spacing="2">SIX-BIT PAYLOAD / OPERATOR SLOT</text>
